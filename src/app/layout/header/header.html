<!-- En la ruta del menú no se pega: allí manda la barra de categorías. -->
<header
  class="z-20 border-b border-line bg-cream/90 backdrop-blur"
  [class.sticky]="!isMenuRoute()"
  [class.top-0]="!isMenuRoute()"
>
  <div
    class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-6 py-4 max-[720px]:gap-3 max-[720px]:px-5 max-[720px]:py-3.5"
  >
    <a
      routerLink="/"
      class="titular text-xl transition-colors hover:text-brand max-[720px]:text-base"
    >
      Restaurante Chopsuey Pereira
    </a>

    <nav
      class="flex shrink-0 items-center gap-6 text-[12.5px] tracking-[0.16em] uppercase max-[720px]:gap-4"
    >
      <a
        routerLink="/"
        routerLinkActive="text-brand! border-brand! font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        class="border-b-2 border-transparent pb-0.5 text-ink-muted transition-colors hover:text-brand"
      >
        Inicio
      </a>
      <a
        routerLink="/menu"
        routerLinkActive="text-brand! border-brand! font-medium"
        class="border-b-2 border-transparent pb-0.5 text-ink-muted transition-colors hover:text-brand"
      >
        Menú
      </a>
    </nav>
  </div>
</header>
